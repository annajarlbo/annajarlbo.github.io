<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slideshow</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      margin: 0;
      background: #fff;
    }

    .slideshow-container {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      width: 100vw;
      height: 100vh;
      align-items: center;
    }

    .slide {
      flex: 0 0 auto;
      width: 80vw;
      height: 80vh;
      margin: 0 2vw;
      scroll-snap-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 1.5rem;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>

<body>
  <div class="slideshow-container">
    <div class="slide"><img src="images/profile_flowers.jpg" alt="Profile Flowers"></div>
    <div class="slide"><img src="images/becksondergaard/BS_IMG_6035.jpeg" alt="Becksondergaard 1"></div>
    <div class="slide"><img src="images/becksondergaard/BS_IMG_6210.jpeg" alt="Becksondergaard 2"></div>
    <div class="slide"><img src="images/becksondergaard/BS_IMG_6399.jpeg" alt="Becksondergaard 3"></div>
    <div class="slide"><img src="images/becksondergaard/BS_IMG_7599.jpeg" alt="Becksondergaard 4"></div>
    <div class="slide"><img src="images/becksondergaard/BS_IMG_7869.jpeg" alt="Becksondergaard 5"></div>
    <div class="slide"><img src="images/rfshop2022/OZ0A1456.jpg" alt="RF Shop 1"></div>
    <div class="slide"><img src="images/rfshop2022/OZ0A1604.jpg" alt="RF Shop 2"></div>
    <div class="slide"><img src="images/rfshop2022/OZ0A1749.jpg" alt="RF Shop 3"></div>
    <div class="slide"><img src="images/rfshop2022/OZ0A1797.jpg" alt="RF Shop 4"></div>
    <div class="slide"><img src="images/rfshop2022/OZ0A1911.jpg" alt="RF Shop 5"></div>
  </div>
</body>

</html>
