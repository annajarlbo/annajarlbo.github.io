<head>
  <meta charset="UTF-8">

  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon_package_v0.16/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon_package_v0.16/favicon-16x16.png">
  <style>
    @font-face {
      font-family: 'Kaoly';
      src: url('assets/fonts/kaoly/Kaoly-Regular.woff2') format('woff2'),
        url('assets/fonts/kaoly/Kaoly-Regular.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0a0a0a;
      color: #fff;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header / Navigation */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
    }

    .logo {
      font-family: 'Kaoly', 'Georgia', serif;
      font-size: 2.5rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      transition: text-shadow 0.3s ease;
    }

    .logo:hover {
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }

    nav {
      display: flex;
      gap: 30px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      transition: all 0.3s ease;
      position: relative;
    }

    nav a::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 0;
      height: 1px;
      background: #fff;
      transition: width 0.3s ease;
    }

    nav a:hover::after {
      width: 100%;
    }

    /* Mobile menu toggle */
    .menu-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      z-index: 1001;
    }

    .menu-toggle span {
      width: 25px;
      height: 2px;
      background: #fff;
      transition: all 0.3s ease;
    }

    /* Gallery */
    .gallery {
      padding: 120px 20px 40px;
      columns: 4 300px;
      column-gap: 15px;
      max-width: 1800px;
      margin: 0 auto;
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 15px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .gallery-item img {
      width: 100%;
      display: block;
      transition: transform 0.5s ease, filter 0.5s ease;
      filter: grayscale(0%);
    }

    .gallery-item:hover img {
      transform: scale(1.05);
      filter: grayscale(0%) brightness(1.1);
    }

    .gallery-item::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.3) 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 1;
      pointer-events: none;
    }

    .gallery-item:hover::before {
      opacity: 1;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      cursor: zoom-out;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: 30px;
      right: 30px;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .lightbox-close:hover {
      transform: rotate(90deg);
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: #fff;
      font-size: 3rem;
      cursor: pointer;
      padding: 20px;
      transition: opacity 0.3s ease;
      user-select: none;
    }

    .lightbox-nav:hover {
      opacity: 0.7;
    }

    .lightbox-prev {
      left: 20px;
    }

    .lightbox-next {
      right: 20px;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 40px 20px;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: #666;
      border-top: 1px solid #222;
    }

    footer a {
      color: #888;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    footer a:hover {
      color: #fff;
    }

    /* Social Icons */
    .social-links {
      display: flex;
      gap: 20px;
    }

    .social-links a {
      color: #fff;
      font-size: 1.2rem;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .social-links a:hover {
      transform: translateY(-3px);
      opacity: 0.7;
    }

    /* Responsive */
    @media (max-width: 768px) {
      header {
        padding: 15px 20px;
      }

      .logo {
        font-size: 1.8rem;
      }

      .menu-toggle {
        display: flex;
      }

      nav {
        position: fixed;
        top: 0;
        right: -100%;
        width: 100%;
        height: 100vh;
        background: #0a0a0a;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 40px;
        transition: right 0.3s ease;
      }

      nav.active {
        right: 0;
      }

      nav a {
        font-size: 1.2rem;
      }

      .gallery {
        columns: 2 150px;
        padding: 100px 10px 30px;
        column-gap: 10px;
      }

      .gallery-item {
        margin-bottom: 10px;
      }

      .social-links {
        display: none;
      }
    }

    /* Loading animation */
    .gallery-item {
      animation: fadeInUp 0.6s ease forwards;
      opacity: 0;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Staggered animation delays */
    .gallery-item:nth-child(1) {
      animation-delay: 0.1s;
    }

    .gallery-item:nth-child(2) {
      animation-delay: 0.15s;
    }

    .gallery-item:nth-child(3) {
      animation-delay: 0.2s;
    }

    .gallery-item:nth-child(4) {
      animation-delay: 0.25s;
    }

    .gallery-item:nth-child(5) {
      animation-delay: 0.3s;
    }

    .gallery-item:nth-child(6) {
      animation-delay: 0.35s;
    }

    .gallery-item:nth-child(7) {
      animation-delay: 0.4s;
    }

    .gallery-item:nth-child(8) {

    }

    .gallery-item:nth-child(9) {

    .gallery-item:nth-child(10) {

    }

    .gallery-item:nth-child(n+11) {

    }
  </style>

  <script>
    // Mobile menu toggle
    function toggleMenu() {
      document.getElementById('nav').classList.toggle('active');
    }

    // Lightbox functionality
    const galleryItems = document.querySelectorAll('.gallery-item img');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    let currentIndex = 0;

    galleryItems.forEach((img, index) => {
      img.addEventListener('click', () => {
        currentIndex = index;
        lightboxImg.src = img.src;
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
      });
    });

    function closeLightbox() {
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
    }

    function navigateLightbox(direction) {
      currentIndex += direction;
      if (currentIndex < 0) currentIndex = galleryItems.length - 1;
      if (currentIndex >= galleryItems.length) currentIndex = 0;
      lightboxImg.src = galleryItems[currentIndex].src;
    }

    // Close lightbox on background click
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) {
        closeLightbox();
      }
    });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navigateLightbox(-1);
      if (e.key === 'ArrowRight') navigateLightbox(1);
    });

    // Smooth scroll for anchor links
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({ behavior: 'smooth' });
          // Close mobile menu if open
          document.getElementById('nav').classList.remove('active');
        }
      });
    });
  </script>
